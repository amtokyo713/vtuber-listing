<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0f14">
<title>VTuber資産ポータル</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0d0f14;
  --raise:#14171e;
  --raise2:#1b1f28;
  --line:#252a35;
  --line2:#353b49;
  --text:#ebe8e2;
  --muted:#a4aab6;
  --faint:#838a99;
  --accent:#dba35a;
  --accent-ink:#1a1306;
  --accent-soft:rgba(219,163,90,.13);
  --accent-line:rgba(219,163,90,.5);
  --shadow:0 8px 24px rgba(8,10,14,.65);
  --gutter:16px;
  --nav-h:60px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark;overflow-x:clip}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
a{color:inherit}
a,button,summary,.chip,label{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main:focus{outline:none}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
/* id セレクタの display 指定は UA の [hidden]{display:none} を特異性で上回るため、
   hidden 属性が効かなくなる。全要素に対して明示的に打ち消す（2026-08-31 実機検証で
   ローカル版なのにパスワードゲートが出続けて発覚）。 */
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
svg{flex:none}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:inset 0 -2px 0 var(--accent-line)}

/* ---------- パスワードゲート ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;padding:20px}
#gate .box{width:min(400px,100%);text-align:center}
#gate h1{font-size:20px;margin:0 0 6px;letter-spacing:.04em}
#gate p{color:var(--muted);font-size:14px;margin:0 0 22px}
#gate .pwwrap{position:relative}
/* 左右対称の padding にして、目アイコンを足しても入力文字の中央寄せが崩れないようにする。
   16px 未満だと iOS が入力フォーカスで画面を自動ズームするため下げない。 */
#gate input{
  width:100%;height:52px;padding:0 52px;border-radius:12px;border:1px solid var(--line2);
  background:var(--raise);color:var(--text);font-family:inherit;font-size:16px;text-align:center;letter-spacing:.2em;
}
#gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
#gate input::placeholder{letter-spacing:.05em;color:var(--faint)}
#gate .eye{
  position:absolute;right:0;top:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;padding:0;font-size:18px;line-height:1;color:var(--muted);
}
#gate button[type="submit"]{
  width:100%;min-height:52px;margin-top:12px;padding:0 16px;border:0;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;
}
#gate button[type="submit"]:disabled{opacity:.6;cursor:default}
#gate .msg{margin-top:14px;font-size:14px;min-height:22px;color:var(--accent)}

/* ---------- 読み込み中 ---------- */
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90}
#loading .l{text-align:center;color:var(--muted);font-size:14px}
#loading .bar{width:170px;height:3px;border-radius:2px;background:var(--raise2);margin:14px auto 0;overflow:hidden}
#loading .bar i{display:block;width:100%;height:100%;background:var(--accent);opacity:.55}
@media (prefers-reduced-motion:no-preference){
  #loading .bar i{width:40%;opacity:1;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
}

/* ---------- 読み込み失敗の最終画面（fatal() が使う） ---------- */
.empty{text-align:center;color:var(--muted);padding:44px 20px 50px;font-size:15px}
.path{font-family:ui-monospace,"Consolas",monospace;font-size:12px;color:var(--faint);word-break:break-all}
#retry{background:var(--accent)!important;color:var(--accent-ink)!important;min-height:44px}
#hardreset{background:var(--raise2);border:1px solid var(--line2);color:var(--text);min-height:44px}

/* ---------- 上の帯 ---------- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 var(--gutter);background:var(--bg);border-bottom:1px solid var(--line)}
.brand-m{font-weight:700;font-size:16px;letter-spacing:.02em}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-left:-8px;padding:0 12px 0 6px;background:none;border:0;border-radius:10px;color:var(--text);font-size:15px}
.search-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border:1px solid var(--line2);border-radius:22px;background:var(--raise);color:var(--text);font-size:16px}
.search-btn .hint{display:none;color:var(--muted)}

/* ---------- 下の固定ナビ（PC では左の縦ナビ） ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#11141a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .brand-d{display:none}
.tabs a{flex:1;min-width:0;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint);font-size:12px;line-height:1.3;text-decoration:none;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.tabs svg{width:24px;height:24px}

/* ---------- 本文の枠 ---------- */
.page{max-width:1000px;margin:0 auto;padding:20px var(--gutter) calc(var(--nav-h) + 36px + env(safe-area-inset-bottom))}
.head{margin-bottom:8px}
h1{font-size:24px;line-height:1.35;font-weight:700}
.sub{margin-top:2px;color:var(--muted);font-size:14px;line-height:1.6}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:22px 0 6px}
h2{font-size:17px;line-height:1.4;font-weight:700}
.more{display:inline-flex;align-items:center;min-height:44px;padding:0 4px 0 12px;color:var(--accent);font-size:14px;text-decoration:none;background:none;border:0}
.note{margin:6px 0 0;color:var(--faint);font-size:13px;line-height:1.6}

/* ---------- 小さな印 ---------- */
.role{display:inline-block;padding:0 8px;border:1px solid var(--line2);border-radius:6px;color:var(--muted);font-size:12px;font-weight:400;line-height:22px;white-space:nowrap}
.role.talent{border-color:var(--accent-line);color:var(--accent)}
.tag{display:inline-block;padding:0 8px;border-radius:6px;background:var(--raise2);color:var(--muted);font-size:12px;line-height:22px}
.tag.lock{color:var(--text)}
.tag.pdf{background:transparent;border:1px solid var(--accent-line);color:var(--accent);line-height:20px}
.tag.new{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tag.stop{margin-left:6px;vertical-align:1px}
.live{color:var(--accent);font-weight:700}

/* ---------- ボタンとチップ ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--raise2);color:var(--text);font-size:14px;line-height:1.3;text-align:center;text-decoration:none}
.btn.pdf,.btn.pri{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:6px calc(var(--gutter) * -1) 4px;padding:0 var(--gutter) 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:22px;background:transparent;color:var(--text);font-size:14px;text-decoration:none;white-space:nowrap}
.chip .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"],.chip[aria-current="true"]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.none{margin:28px 0;padding:20px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);font-size:15px}
.none .btn{margin:12px 8px 0 0}

/* ---------- ホーム ---------- */
.hscroll{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;margin:0 calc(var(--gutter) * -1);padding:4px var(--gutter) 12px;scroll-padding:0 var(--gutter)}
.pin{position:relative;flex:0 0 min(78vw,300px);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;min-height:178px;padding:16px;border:1px solid var(--line2);border-radius:14px;background:var(--raise);color:inherit;box-shadow:var(--shadow)}
.pin-main{display:flex;flex-direction:column;gap:6px;flex:1;color:inherit;text-decoration:none}
.pin-main::after{content:"";position:absolute;inset:0;border-radius:14px}
.pin .acts{position:relative;z-index:1;margin-top:4px}
.pin .pn{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pin .nm{font-size:19px;font-weight:700;line-height:1.4}
.pin .ps{color:var(--muted);font-size:13px;line-height:1.5}
.pin .pl{display:block;font-size:14px;line-height:1.6}
.pin .pl b{display:block;color:var(--faint);font-size:12px;font-weight:500}
.pin .pf{margin-top:auto;color:var(--faint);font-size:13px}
.pin.add{flex-basis:190px;align-items:center;justify-content:center;gap:6px;border-style:dashed;background:transparent;box-shadow:none;color:var(--muted);text-align:center;font-size:14px;text-decoration:none}
.pin.add svg{width:26px;height:26px}
.newbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:14px;padding:10px 12px 10px 16px;border:1px solid var(--accent-line);border-radius:12px;background:var(--accent-soft);font-size:15px}
.newbar b{color:var(--accent)}
.newbar .btns{display:flex;gap:8px}
.home-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 36px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.tile{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-height:76px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:inherit;text-decoration:none}
.tile .nm{display:block;font-size:16px;font-weight:700;line-height:1.45}
.tile .ds{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.tile .up{display:block;margin-top:4px;color:var(--faint);font-size:13px;line-height:1.5}
.tile .up b{color:var(--muted);font-weight:500}
.tile svg{width:18px;height:18px;margin-top:4px;color:var(--faint)}
.tile.stopped .nm{color:var(--muted)}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;margin-top:10px;padding:8px 16px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;font-size:15px}
.linkrow span:last-child{color:var(--accent);font-size:14px}
.news{border-top:1px solid var(--line)}
.news-item{display:grid;grid-template-columns:48px minmax(0,1fr);gap:0 8px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.news-item time{padding-top:1px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.news-item .nt{font-size:15px;line-height:1.55}
.news-item .nc{display:block;margin-top:2px;color:var(--faint);font-size:12px}

/* ---------- 人物の一覧 ---------- */
.grp{display:flex;align-items:baseline;gap:8px;margin:22px 0 2px;font-size:15px;color:var(--muted)}
.grp span{color:var(--faint);font-size:13px;font-weight:400}
.plist{border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.prow-link{flex:1;min-width:0;display:block;min-height:68px;padding:12px 0;color:inherit;text-decoration:none}
.pr-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.pr-name{font-size:17px;font-weight:700;line-height:1.4}
.pr-sub{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.pr-meta{display:block;margin-top:2px;color:var(--faint);font-size:13px}
.pinbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:84px;min-height:44px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--faint);font-size:13px}
.pinbtn svg{width:18px;height:18px}
.pinbtn[aria-pressed="true"]{color:var(--accent)}
.pinbtn[aria-pressed="true"] svg{fill:var(--accent-soft)}

/* ---------- 資料の並び（資料タブ・検索・年表で共通） ---------- */
.month{display:flex;align-items:baseline;gap:8px;margin:24px 0 4px;color:var(--muted);font-size:15px}
.month span{color:var(--faint);font-size:13px;font-weight:400}
.doclist{border-top:1px solid var(--line)}
.item{padding:4px 0 12px;border-bottom:1px solid var(--line)}
.item-main{display:grid;grid-template-columns:minmax(0,1fr) 20px;gap:0 8px;align-items:center;min-height:56px;padding:10px 0 2px;color:inherit;text-decoration:none}
.item-main .chev{width:20px;height:20px;color:var(--faint)}
.chev svg{width:20px;height:20px}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.dmeta time{margin-right:4px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.dt{display:block;font-size:16px;font-weight:700;line-height:1.55}
.sum{display:block;margin-top:4px;color:var(--muted);font-size:14px;line-height:1.65}
.sum.clamp2{display:-webkit-box}
.who{display:block;margin-top:4px;color:var(--faint);font-size:13px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.acts:empty{display:none}
.dsearch{position:relative;margin-top:14px}
.dsearch input{display:block;width:100%;height:48px;padding:0 48px 0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--raise);color:var(--text);font-family:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.dsearch input::-webkit-search-cancel-button{display:none}
.dsearch input::placeholder{color:var(--faint)}
.dsearch .clr{position:absolute;right:2px;top:2px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted)}
.dsearch .clr svg{width:20px;height:20px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--muted);font-size:14px}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.morebtn{display:flex;width:100%;justify-content:center;margin-top:18px}

/* ---------- 人物ページ ---------- */
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.phead h1{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.pmeta{margin-top:8px;color:var(--muted);font-size:14px}
.pdfrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 40px;margin-top:16px}
.panel{padding:16px 18px;border:1px solid var(--line2);border-radius:14px;background:var(--raise)}
.concl .lab{margin-bottom:8px;color:var(--accent);font-size:13px;letter-spacing:.06em}
.concl p{font-size:17px;line-height:1.7;font-weight:700}
.concl.cl p + p{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.concl .lt{font-size:16px}
.concl .ld{margin-top:4px;color:var(--muted);font-size:14px;font-weight:400}
.concl .src{display:flex;align-items:center;min-height:44px;margin-top:8px;color:var(--accent);font-size:14px;font-weight:400;text-decoration:none}
.alias{margin-top:20px;color:var(--faint);font-size:13px;line-height:1.7}
.alias b{display:block;color:var(--muted);font-weight:500}
.tl{margin-top:4px;border-left:2px solid var(--line)}
.tl-mon{padding:18px 0 4px 14px}
.tl-mon h3{color:var(--muted);font-size:15px;font-weight:700}
.tl-item{display:grid;grid-template-columns:54px minmax(0,1fr);gap:0 6px;padding:8px 0 4px 14px;border-bottom:1px solid var(--line)}
.tl-item .item{padding:0;border:0}
.tl-item .item-main{padding-top:6px}
.tl-date{padding-top:12px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* ---------- ツールとサイト ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:6px}
.card{padding:16px 18px;border:1px solid var(--line2);border-radius:14px;background:var(--raise)}
.card.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card h3{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:16px;line-height:1.5}
.card .kind{color:var(--faint);font-size:12px;font-weight:400}
.card .what{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.7}
.card .kv{display:grid;gap:4px;margin-top:10px;color:var(--faint);font-size:13px}
.card .kv b{margin-right:8px;color:var(--muted);font-weight:500}
.card .nbox{margin-top:10px;padding:8px 12px;border-left:2px solid var(--accent);border-radius:0 8px 8px 0;background:var(--accent-soft);color:var(--text);font-size:13px;line-height:1.65}
.card .acts{margin-top:12px}
.badge{display:inline-block;padding:0 9px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);font-size:12px;font-weight:700;line-height:20px}
.b-live,.b-on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.b-active{color:var(--text);border-color:var(--accent-line)}
.b-quiet{color:var(--muted)}
.b-dormant,.b-empty,.b-off{color:var(--faint)}
.b-lock{color:#d99a8c;border-color:rgba(217,154,140,.45)}
.card .kv a{color:var(--accent)}
.warnbox{margin-top:10px;padding:8px 12px;border-left:2px solid #d99a8c;border-radius:0 8px 8px 0;background:rgba(217,154,140,.08);color:var(--text);font-size:13px;line-height:1.65}

/* ---------- 全画面の検索 ---------- */
.search{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
.s-bar{border-bottom:1px solid var(--line);padding:10px var(--gutter)}
.s-bar-in{display:flex;align-items:center;gap:8px;width:100%;max-width:720px;margin:0 auto}
.s-field{position:relative;flex:1;min-width:0}
.s-field input{display:block;width:100%;height:48px;padding:0 48px 0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--raise);color:var(--text);font-family:inherit;font-size:17px;-webkit-appearance:none;appearance:none}
.s-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.s-field input::-webkit-search-cancel-button{display:none}
.s-field input::placeholder{color:var(--faint)}
.s-clr{position:absolute;right:2px;top:2px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted)}
.s-clr svg{width:20px;height:20px}
.s-close{flex:none;min-height:44px;padding:0 6px 0 10px;border:0;background:transparent;color:var(--accent);font-size:15px}
.s-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px var(--gutter) 48px}
.s-inner{max-width:720px;margin:0 auto}
.s-sum{margin:14px 0 0;color:var(--muted);font-size:14px}
.rg{display:flex;align-items:baseline;gap:8px;margin:22px 0 6px;font-size:15px;color:var(--muted)}
.rg span{color:var(--faint);font-size:13px;font-weight:400}

<body>

<script>
"use strict";
const MODE = "publish";           // "local" | "encrypted"
let DATA = null;

/* ============ 復号（build 側 crypto.py と対。片方を変えたら両方揃えること） ============ */
function b64d(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), {name:"PBKDF2"}, false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function gunzip(buf){
  // パスワード誤りと端末非対応は原因が違う。catch 側で見分けられるよう印を付ける。
  if (typeof DecompressionStream === "undefined"){
    const e = new Error("この端末は gzip 展開に対応していません"); e.code = "NOGZIP"; throw e;
  }
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([buf]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function decryptWithKey(enc, key){
  let pt = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(enc.iv)}, key, b64d(enc.ciphertext)));
  if (enc.compress === "gzip") pt = await gunzip(pt);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* 導出済み鍵のキャッシュ（katana / skeb と同じ設計＝**平文パスワードは持たない**）。
   CryptoKey は extractable:false で作るので、IndexedDB に入っても値を取り出せない。
   PBKDF2 60万反復はスマホで約1秒かかるため、2回目以降はこれを飛ばして即解錠する。 */
function _keyId(enc){ return "k:" + (enc.salt || "") + ":" + (enc.iterations || 0); }
function _idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("vtuber-portal-keys", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("keys");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function _idbGet(id){
  try{
    const db = await _idb();
    return await new Promise(res => {
      const q = db.transaction("keys", "readonly").objectStore("keys").get(id);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  }catch(e){ return null; }          // プライベートウィンドウ等では使えない。素通りさせる
}
async function _idbPut(id, key){
  try{
    const db = await _idb();
    db.transaction("keys", "readwrite").objectStore("keys").put(key, id);
  }catch(e){}
}

/* ============ 起動 ============ */

/** 読み込み・描画に失敗したときの最終画面。
    standalone（ホーム画面から起動）だとリロード UI が無いので再試行手段を必ず残す。
    **原因を必ず出す**こと: 黙って空の画面になると「データが全部消えた」としか見えず、
    サーバ側の障害と端末側の障害を切り分けられない（2026-09-04 の調査で判明）。 */
function fatal(e){
  const line = e && e.stack ? String(e.stack).split("\n").slice(0,2).join(" / ") : "";
  const detail = (e && e.message ? e.message : String(e)) + (line ? "  [" + line + "]" : "");
  document.body.innerHTML = `<div class="empty" style="padding-top:80px">
    読み込みに失敗しました<br><span class="path">${esc(detail)}</span>
    <div class="acts" style="display:flex; justify-content:center; gap:10px; margin-top:20px">
      <button class="primary" id="retry" style="padding:10px 18px; border-radius:9px; border:0; background:#7c5cff; color:#fff; font-weight:700">再読み込み</button>
      <button id="hardreset" style="padding:10px 18px; border-radius:9px">保存データを消して再試行</button>
    </div></div>`;
  const r = document.getElementById("retry");
  if(r) r.onclick = () => location.reload();
  // 端末に残った鍵・既読状態が壊れている場合の自力復旧（パスワードの再入力が必要になる）。
  const h = document.getElementById("hardreset");
  if(h) h.onclick = async () => {
    try{ localStorage.removeItem(LS_SEEN); }catch(err){}
    try{ indexedDB.deleteDatabase("vtuber-portal-keys"); }catch(err){}
    setTimeout(() => location.reload(), 300);
  };
}

async function boot(){
  const res = await fetch("data.json", {cache:"no-cache"});
  if(!res.ok) throw new Error("data.json を取得できません ("+res.status+")");
  const raw = await res.json();
  if (MODE === "local" || !raw.ciphertext){ DATA = raw; render(); return; }

  // 1) 前回の導出済み鍵があれば PBKDF2（スマホで約1秒）を飛ばして即解錠
  // 復号と描画を**別の try に分ける**。同じ try に入れると描画の失敗まで「鍵が古い」と
  // 誤判定してゲートへ落ち、正しいパスワードでも「パスワードが違います」になる。
  const cached = await _idbGet(_keyId(raw));
  if (cached){
    let payload = null;
    try{ payload = await decryptWithKey(raw, cached); }
    catch(e){ /* パスワード変更後などは失敗する。ゲートへ落とす */ }
    if (payload){ DATA = payload; render(); return; }   // 描画の失敗は boot().catch → fatal() へ
  }

  const gate = document.getElementById("gate");
  document.getElementById("loading").hidden = true;
  gate.hidden = false;
  const pwEl = document.getElementById("pw"), msg = document.getElementById("gatemsg");
  const btn = document.getElementById("unlock");
  const tryUnlock = async (pw) => {
    if(!pw || btn.disabled) return;
    btn.disabled = true;                       // PBKDF2 の1秒間に連打すると鍵導出が多重に走る
    msg.textContent = "解錠中…（初回は数秒かかります）";
    let payload = null;
    try{
      const key = await deriveKey(pw, b64d(raw.salt), raw.iterations);
      payload = await decryptWithKey(raw, key);
      await _idbPut(_keyId(raw), key);   // 保存するのは鍵だけ。パスワードは残さない
    }catch(e){
      msg.textContent = e && e.code === "NOGZIP"
        ? "この端末は表示に必要な機能（gzip 展開）に未対応です。別のブラウザでお試しください"
        : "パスワードが違います";
      return;
    }finally{
      btn.disabled = false;
    }
    // 復号は成功。ここから先の失敗は「パスワードが違う」ではないので、
    // ゲートに嘘を出さず fatal() で原因ごと見せる（黙って空画面にしない）。
    try{
      DATA = payload;
      gate.hidden = true;
      render();
    }catch(e){
      fatal(e);
    }
  };
  msg.textContent = "";
  // form の submit に集約すると、キーボードの「go」でもボタンでも同じ経路になる
  document.getElementById("gateform").onsubmit = e => { e.preventDefault(); tryUnlock(pwEl.value.trim()); };
  document.getElementById("pwtoggle").onclick = () => {
    const show = pwEl.type === "password";
    pwEl.type = show ? "text" : "password";
    const t = document.getElementById("pwtoggle");
    t.textContent = show ? "🙈" : "👁";
    t.setAttribute("aria-label", show ? "パスワードを隠す" : "パスワードを表示");
    pwEl.focus();
  };
  pwEl.focus();
}

/* ============ 描画 ============ */
const $ = id => document.getElementById(id);
const qs = (s, r) => (r || document).querySelector(s);
const qsa = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;
const dec = s => { try{ return decodeURIComponent(s); }catch(e){ return s; } };
/** 外へ出るリンクは http(s) だけ許す（データ由来の文字列を href に入れるため）。 */
const safeUrl = u => (typeof u === "string" && /^https?:\/\//i.test(u)) ? u : null;
let NEW_IDS = new Set();          // 前回訪問以降に増えた文書
const LS_SEEN = "vp:seen";
const LS_PINS = "vp:pins";

/* ---------- ことば合わせ（全角半角・ひらがな/カタカナ・大小文字・空白を同一視） ---------- */
function foldKana(s){
  return s.replace(/[ぁ-ゖ]+/g, run => {
    let o = "";
    for(let i = 0; i < run.length; i++) o += String.fromCharCode(run.charCodeAt(i) + 0x60);
    return o;
  });
}
function norm(s){
  return foldKana(String(s == null ? "" : s).normalize("NFKC").toLowerCase()).replace(/\s+/g, "");
}
function terms(q){
  return String(q == null ? "" : q).normalize("NFKC").split(/\s+/).map(norm).filter(Boolean);
}
/** 1 文字ずつ正規化し、正規化後の位置から元の文字列の位置へ戻せる表を作る（一致箇所の強調用）。 */
function foldMap(s){
  let f = ""; const ms = [], me = []; let i = 0;
  for(const ch of String(s == null ? "" : s)){
    const len = ch.length, n = ch.normalize("NFKC").toLowerCase();
    for(const c of n){
      if(/\s/.test(c)) continue;
      const cp = c.codePointAt(0);
      const o = (cp >= 0x3041 && cp <= 0x3096) ? String.fromCodePoint(cp + 0x60) : c;
      for(let k = 0; k < o.length; k++){ f += o[k]; ms.push(i); me.push(i + len); }
    }
    i += len;
  }
  return {f, ms, me};
}
function hl(text, ts){
  const s = String(text == null ? "" : text);
  if(!ts || !ts.length) return esc(s);
  const m = foldMap(s), r = [];
  ts.forEach(t => {
    if(!t) return;
    let from = 0, ix;
    while((ix = m.f.indexOf(t, from)) >= 0){ r.push([m.ms[ix], m.me[ix + t.length - 1]]); from = ix + t.length; }
  });
  if(!r.length) return esc(s);
  r.sort((a, b) => a[0] - b[0]);
  const merged = [r[0].slice()];
  for(let j = 1; j < r.length; j++){
    const l = merged[merged.length - 1];
    if(r[j][0] <= l[1]) l[1] = Math.max(l[1], r[j][1]); else merged.push(r[j].slice());
  }
  let out = "", pos = 0;
  merged.forEach(x => { out += esc(s.slice(pos, x[0])) + "<mark>" + esc(s.slice(x[0], x[1])) + "</mark>"; pos = x[1]; });
  return out + esc(s.slice(pos));
}

/* ---------- 日付 ---------- */
const pad2 = n => String(n).padStart(2, "0");
const YEAR = String(new Date().getFullYear());
/** N 日前の日付（YYYY-MM-DD）。docs の date と文字列比較する。 */
function cutoff(days){
  const d = new Date(); d.setDate(d.getDate() - days);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function ymd(d){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? {y:+m[1], m:+m[2], d:+m[3]} : null; }
function dateJa(d){ const x = ymd(d); return x ? (String(x.y) === YEAR ? "" : x.y + "年") + x.m + "月" + x.d + "日" : (d || ""); }
function dateLong(d){ const x = ymd(d); return x ? x.y + "年" + x.m + "月" + x.d + "日" : (d || ""); }
function dateShort(d){ const x = ymd(d); return x ? x.m + "/" + x.d : (d || ""); }
function monthJa(d){ const x = ymd(d); return x ? x.y + "年" + x.m + "月" : ""; }

let DOCS = [], BYID = {}, PEOPLE = [], PBYID = {}, DOC_PEOPLE = {};
let ROLE_KEYS = [], PROJ = [], PROJ_BY_ID = {}, SITES = [], SHEETS = [], CATS = [], CAT_LABEL = {};
const newest = (a, b) => String(b.date).localeCompare(String(a.date)) || String(a.title).localeCompare(String(b.title), "ja");
const PSTATUS_ORDER = ["live","active","quiet","dormant","empty"];

function roleLabel(k){ return ((DATA.roles || {})[k]) || k || "その他"; }

function prepare(){
  DOCS = (DATA.docs || []).slice();
  BYID = {};
  DOCS.forEach(d => {
    BYID[d.id] = d;
    d._t = norm(d.title);
    // 打鍵ごとの再計算をしないための軽い索引（題名・要約・分類・パス）。本文は別（必要な時だけ）。
    d._h = norm([d.title, d.summary, d.category_label, d.rel].join(" "));
    CAT_LABEL[d.category] = CAT_LABEL[d.category] || d.category_label;
  });
  DOCS.sort(newest);

  PEOPLE = DATA.people || [];
  PBYID = {}; DOC_PEOPLE = {};
  PEOPLE.forEach(p => {
    PBYID[p.id] = p;
    p.aliases = p.aliases || [];
    p._docs = (p.doc_ids || []).map(id => BYID[id]).filter(Boolean);   // doc_ids は新しい順
    p._pdf = p._docs.find(d => safeUrl(d.pdf)) || null;
    p._n = {name: norm(p.name), aliases: p.aliases.map(norm), sub: norm(p.sub), role: norm(roleLabel(p.role))};
    p._docs.forEach(d => (DOC_PEOPLE[d.id] ||= []).push(p.id));
  });
  ROLE_KEYS = Object.keys(DATA.roles || {}).filter(k => PEOPLE.some(p => p.role === k));
  PEOPLE.forEach(p => { if(ROLE_KEYS.indexOf(p.role) < 0) ROLE_KEYS.push(p.role); });

  // 状態の順（自動で動いている → 最近更新 → …）、同じ状態の中は最終更新の新しい順
  PROJ = (DATA.projects || []).map((p, i) => ({p, i}))
    .sort((a, b) => (PSTATUS_ORDER.indexOf(a.p.status) + 1 || 99) - (PSTATUS_ORDER.indexOf(b.p.status) + 1 || 99)
      || String(b.p.last_change || "").localeCompare(String(a.p.last_change || "")) || a.i - b.i)
    .map(x => x.p);
  PROJ_BY_ID = {};
  // 名前（README の見出し）とフォルダ名のどちらでも探せるように
  PROJ.forEach(p => { PROJ_BY_ID[p.id] = p; p._t = norm(p.name + " " + (p.folder || "")); });
  SITES = DATA.sites || [];
  SITES.forEach(s => { s._t = norm(s.name); });
  SHEETS = (DATA.sheets || []).slice();
  SHEETS.forEach(s => { s._t = norm(s.name); });

  const present = {};
  DOCS.forEach(d => { present[d.category] = true; });
  CATS = (DATA.categories || []).map(c => c.id).filter(id => present[id]);
  Object.keys(present).forEach(id => { if(CATS.indexOf(id) < 0) CATS.push(id); });
}

/** 前回訪問との差分を出す。週次で勝手に増える設計なので「何が増えたか」を出せないと気づけない。
    generated_at が変わるまでは計算済みの差分を保つ（リロードで NEW が消えないように）。 */
function computeNew(){
  const cur = DATA.docs.map(d => d.id);
  let seen = null;
  try{ seen = JSON.parse(localStorage.getItem(LS_SEEN) || "null"); }catch(e){}
  const save = o => { try{ localStorage.setItem(LS_SEEN, JSON.stringify(o)); }catch(e){} };
  if(!seen || !Array.isArray(seen.ids)){
    save({gen: DATA.generated_at, ids: cur, newIds: []});   // 初回は基準を作るだけ
    return;
  }
  if(seen.gen === DATA.generated_at){
    NEW_IDS = new Set(seen.newIds || []);
    return;
  }
  const known = new Set(seen.ids);
  const diff = cur.filter(id => !known.has(id));
  NEW_IDS = new Set(diff);
  save({gen: DATA.generated_at, ids: cur, newIds: diff});
}
function markAllSeen(){
  NEW_IDS = new Set();
  try{ localStorage.setItem(LS_SEEN, JSON.stringify({gen: DATA.generated_at, ids: DATA.docs.map(d => d.id), newIds: []})); }catch(e){}
  dst.newOnly = false;
  refresh();
}

/* ---------- ツール・サイトの共通部品（書庫のパスとプロジェクトの対応） ---------- */
/** 状態は scan_tools.py が毎朝計算する（自動実行の有無と最終更新日）。手で書いた値ではない。 */
const SLABEL = {live:"自動で動いている", active:"最近更新あり", quiet:"しばらく更新なし", dormant:"長く更新なし", empty:"空",
                on:"有効", off:"無効"};
/** プロジェクトの置き場に入っている書庫の文書。パス区切りが `\` と `/` で混在するので正規化して前方一致。 */
const _np = s => String(s||"").replace(/\\/g, "/").toLowerCase();
function projDocs(p){
  if(!p || !p.path) return [];
  const base = _np(p.path).replace(/\/+$/, "") + "/";
  return DATA.docs.filter(d => _np(d.path).startsWith(base));
}
/** その文書を置いてあるプロジェクト（パス前方一致）。公開サイトへの導線に使う。 */
function docProject(d){
  return (DATA.projects || []).find(p =>
    p.path && _np(d.path).startsWith(_np(p.path).replace(/\/+$/, "") + "/"));
}
/** `viewer.html` のように**同じフォルダの JSON を読み込む**成果物は、書庫にページ本体だけを
    取り込んでも中身が空で表示される（隣のデータが無いため）。理由を出さずに空の画面だけ見せると
    「データが全部消えた」としか読めないので、原因と代わりの導線を必ず添える（2026-09-04 の報告）。 */
function dataWarning(d){
  const need = d.needs_data || [];
  if(!need.length) return null;
  const p = docProject(d);
  // 公開 URL が指すのはプロジェクトの**主成果物**だけ。同じフォルダの別ファイル（社内
  // ダッシュボード等）は公開サイトに置かれていないので、押しても違うページに着く。
  // 実測 2026-09-04: pages.dev は未知のパスにも 200 を返すため、404 で気づけない。
  const live = p && p.url && p.main_doc && _np(d.rel).endsWith(_np(p.main_doc)) ? safeUrl(p.url) : "";
  const shown = need.slice(0, 4).join(" / ") + (need.length > 4 ? ` ほか ${need.length - 4} 件` : "");
  const el = document.createElement("div");
  el.className = "rwarn";
  el.innerHTML = `<b>⚠ この成果物は中身を別ファイルから読み込みます（書庫の中では一覧が空になります）</b>
    <p>書庫に取り込んでいるのはページ本体だけです。読み込み先: <span class="path">${esc(shown)}</span></p>
    ${live ? `<p><a class="btn pri" href="${esc(live)}" target="_blank" rel="noopener noreferrer">最新版を公開サイトで開く ↗</a></p>`
           : `<p>このページは公開サイトには置かれていません。中身を見るには PC の元ファイルを開いてください。</p>`}
    <p class="path">元ファイル: ${esc(d.rel)}</p>`;
  return el;
}

/** 本文の全文検索索引。重いので「本文も検索」を選んだ時だけ、画面を固めないよう小分けに作る。 */
function stripTags(h){
  return String(h).replace(/<(script|style)[\s\S]*?<\/\1>/gi, " ").replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
}
function startBodyIndex(){
  if(BODY.ready || BODY.building) return;
  BODY.building = true;
  let i = 0;
  const step = () => {
    const t0 = performance.now();
    while(i < DOCS.length && performance.now() - t0 < 14){
      const d = DOCS[i++];
      d._b = d.body ? norm(stripTags(d.body)) : "";
    }
    if(i < DOCS.length){
      const n = $("dnote");
      if(n && dst.full && dst.q) n.textContent = "本文の検索を準備しています… " + i + "/" + DOCS.length;
      setTimeout(step, 0);
    }else{
      BODY.ready = true; BODY.building = false;
      if(cur.name === "docs") refreshDocs();
    }
  };
  setTimeout(step, 16);   // 先に「準備中」を1度描かせる
}

function viewDocs(){
  return '<div class="head"><h1>資料</h1><p class="sub">新しい順。全部で' + DOCS.length + '件。題名を押すと、このサイトの中で読めます。</p></div>' +

function refreshDocs(){
  const box = $("dres"); if(!box) return;
  const ts = terms(dst.q);
  const needBody = dst.full && ts.length > 0;
  if(needBody && !BODY.ready) startBodyIndex();
  const useBody = needBody && BODY.ready;
  const cut = dst.recent ? cutoff(7) : null;
  const pset = dst.proj && PROJ_BY_ID[dst.proj] ? new Set(projDocs(PROJ_BY_ID[dst.proj]).map(d => d.id)) : null;
  // チップの件数に関わらない絞り込み（期間・新着・プロジェクト・本文あり・ことば）
  const base = DOCS.filter(d => {
    if(cut && d.date < cut) return false;
    if(dst.newOnly && !NEW_IDS.has(d.id)) return false;
    if(pset && !pset.has(d.id)) return false;
    if(dst.readable && !d.body) return false;
    if(ts.length && !ts.every(t => d._h.includes(t) || (useBody && d._b.includes(t)))) return false;
    return true;
  });
  const hasPdf = d => !!safeUrl(d.pdf), isLock = d => d.tier === 3;
  const okP = d => !dst.pdf || hasPdf(d), okL = d => !dst.lock || isLock(d), okC = d => !dst.cat || d.category === dst.cat;
  const list = base.filter(d => okP(d) && okL(d) && okC(d));
  const cPdf = base.filter(d => hasPdf(d) && okL(d) && okC(d)).length;
  const cLock = base.filter(d => isLock(d) && okP(d) && okC(d)).length;
  const inCat = base.filter(d => okP(d) && okL(d));
  const catN = {}; inCat.forEach(d => { catN[d.category] = (catN[d.category] || 0) + 1; });
  const hasUnread = DOCS.some(d => !d.body);
  const chip = (act, v, label, n, on) => '<button class="chip" type="button" data-act="' + act + '"' + (v != null ? ' data-v="' + esc(v) + '"' : "") + ' aria-pressed="' + on + '">' + label + (n != null ? ' <span class="n">' + n + '</span>' : "") + '</button>';
  const proj = dst.proj && PROJ_BY_ID[dst.proj] ? chip("docprojoff", null, "プロジェクト「" + esc(PROJ_BY_ID[dst.proj].name) + "」 ✕", null, true) : "";
  $("dfilters").innerHTML =
    '<div class="chips" role="group" aria-label="しぼりこみ">' +
      chip("docpdf", null, "PDFあり", cPdf, dst.pdf) + chip("doclock", null, "🔒 鍵付き", cLock, dst.lock) +
      chip("docrecentchip", null, "直近7日", null, dst.recent) +
      (hasUnread ? chip("docread", null, "本文あり", null, dst.readable) : "") + proj + '</div>' +
    '<div class="chips scroll" role="group" aria-label="種類でしぼる">' + chip("doccat", "", "すべての種類", inCat.length, !dst.cat) +
      CATS.map(c => chip("doccat", c, esc(CAT_LABEL[c] || c), catN[c] || 0, dst.cat === c)).join("") + '</div>';
  const anyFilter = dst.pdf || dst.lock || dst.readable || dst.recent || dst.newOnly || dst.cat || dst.proj || ts.length;
  const shown = list.slice(0, dst.limit);
  const monthN = {}; list.forEach(d => { const m = monthJa(d.date); monthN[m] = (monthN[m] || 0) + 1; });
  const note = $("dnote");
  if(!(needBody && !BODY.ready)){
    note.textContent = list.length + "件" + (list.length > shown.length ? "のうち、新しい順に" + shown.length + "件を表示中" : "を表示中") +
      (dst.newOnly ? "（前回の訪問から増えた資料だけ）" : "");
  }else{
    note.textContent = "本文の検索を準備しています… 先に題名・要約での結果を出しています。";
  }
  if(!list.length){
    box.innerHTML = '<div class="none">この条件に当てはまる資料はありません。<br>' +
      (dst.q && !dst.full ? '<button class="btn pri" type="button" data-act="tryfull">本文も検索して再実行</button>' : "") +
      (anyFilter ? '<button class="btn" type="button" data-act="docreset">しぼりこみをはずす</button>' : "") + '</div>';
    return;
  }
  const hit = d => useBody && ts.length && !ts.every(t => d._h.includes(t));
  box.innerHTML = groupByMonth(shown).map(g =>
    '<section><h2 class="month">' + esc(g.m) + '<span>' + monthN[g.m] + '件</span></h2><div class="doclist">' +
      g.items.map(d => docRow(d, {who: true, short: true, bodyHit: hit(d), hl: ts.length ? ts : null})).join("") + '</div></section>').join("") +
    (list.length > shown.length ? '<button class="btn morebtn" type="button" data-act="docmore">もっと見る（あと' + (list.length - shown.length) + '件）</button>' : "") +
    (anyFilter ? '<button class="btn morebtn" type="button" data-act="docreset">しぼりこみをはずす</button>' : "");

/* ============ 検索 ============ */
function scorePerson(p, t){
  const n = p._n; let best = 0, why = null;
  if(n.name === t){ best = 100; why = {k: "name"}; }
  else{
    for(let i = 0; i < n.aliases.length; i++){
      const a = n.aliases[i]; let s = 0;
      if(a === t) s = 100; else if(a.indexOf(t) === 0) s = 80; else if(a.indexOf(t) >= 0) s = 60;
      if(s > best){ best = s; why = {k: n.aliases[i] === n.name ? "name" : "alias", v: p.aliases[i]}; }
    }
    if(best < 80 && n.name.indexOf(t) === 0){ best = 80; why = {k: "name"}; }
    else if(best < 60 && n.name.indexOf(t) >= 0){ best = 60; why = {k: "name"}; }
  }
  if(best < 40 && n.sub.indexOf(t) >= 0){ best = 40; why = {k: "sub"}; }
  if(best < 30 && n.role.indexOf(t) >= 0){ best = 30; why = {k: "role"}; }
  return {s: best, why};
}
function nameScore(text, ts){
  let sc = 0;
  for(let i = 0; i < ts.length; i++){
    const at = text.indexOf(ts[i]);
    if(at < 0) return 0;
    sc += 50 + (at === 0 ? 10 : 0);
  }
  return sc;
}
function search(ts){
  const out = {people: [], docs: [], tools: [], sheets: [], sites: []};
  PEOPLE.forEach(p => {
    let min = 1000, why = null;
    for(let i = 0; i < ts.length; i++){
      const r = scorePerson(p, ts[i]);
      if(r.s === 0){ min = 0; break; }
      if(r.s < min) min = r.s;
      if(i === 0) why = r.why;
    }
    if(min > 0) out.people.push({p, s: min, why});
  });
  out.people.sort((a, b) => b.s - a.s || b.p.count - a.p.count);
  DOCS.forEach(d => { const s = nameScore(d._t, ts); if(s > 0) out.docs.push({d, s}); });
  out.docs.sort((a, b) => b.s - a.s || newest(a.d, b.d));
  PROJ.forEach(t => { const s = nameScore(t._t, ts); if(s > 0) out.tools.push({x: t, s}); });
  SHEETS.forEach(t => { const s = nameScore(t._t, ts); if(s > 0) out.sheets.push({x: t, s}); });
  SITES.forEach(t => { const s = nameScore(t._t, ts); if(s > 0) out.sites.push({x: t, s}); });
  out.tools.sort((a, b) => b.s - a.s);
  out.sheets.sort((a, b) => b.s - a.s || String(b.x.modified).localeCompare(String(a.x.modified)));
  out.sites.sort((a, b) => b.s - a.s);
  return out;
}
/** 何で当たったか。名前そのものに当たった時は出さない（強調で分かるため）。 */

}

/* ============ 読み手（資料の本文） ============ */
function showReader(id){
  const d = BYID[id];
  const t = $("rtitle"), body = $("rbody");
  t.classList.remove("open");
  $("rfull").hidden = true; $("rcopy").hidden = true;
  $("rfull").onclick = null;
  if(!d){
    t.textContent = "資料が見つかりません"; t.title = "";
    body.innerHTML = '<div class="rinner"><div class="rmiss"><p>この資料は、このサイトにありません。</p><p>消えたか、リンクが古いのかもしれません。</p><div class="acts"><a class="btn" href="#/docs">資料の一覧へ</a></div></div></div>';
    body.scrollTop = 0;
    return;
  }
  const title = (d.tier === 3 ? "🔒 " : "") + d.title;
  t.textContent = title; t.title = d.title;
  // 元ファイルのパスは Windows のもの。PC で貼り付けて使う人のために残す（スマホでは CSS で隠す）。
  $("rcopy").hidden = !d.path;
  $("rcopy").onclick = () => {
    navigator.clipboard?.writeText(d.path).then(
      () => { $("rcopy").textContent = "コピーしました"; setTimeout(() => $("rcopy").textContent = "パスをコピー", 1600); },
      () => { $("rcopy").textContent = "コピーできません"; setTimeout(() => $("rcopy").textContent = "パスをコピー", 1600); });
  };
  // HTML 成果物（レポート・モック）は枠の中だと読みづらいので、別タブで原寸表示できるようにする。
  // 元ファイルは端末にしか無くスマホからは開けないため、埋め込み済みの本文から Blob を作って開く。
  // 注: blob: はこのページのオリジンを継承するので iframe のサンドボックスは効かない。
  // 中身は自分で書いた HTML だけなので許容する（外部由来の HTML をここに入れないこと）。
  const isHtml = d.body_kind === "iframe" && !!d.body;
  $("rfull").hidden = !isHtml;
  if(isHtml){
    $("rfull").onclick = () => {
      const u = URL.createObjectURL(new Blob([d.body], {type: "text/html"}));
      window.open(u, "_blank", "noopener");
      setTimeout(() => URL.revokeObjectURL(u), 60000);
    };
  }
  const meta = `<div class="rmeta">
        <div><b>分類</b> ${esc(d.category_label)} ／ ${esc(d.root_label)}</div>
        <div><b>日付</b> ${esc(d.date)}（最終更新 ${esc(d.mtime)}）</div>
        <div><b>元ファイル</b> <span class="path">${esc(d.rel)}</span></div>
        ${(safeUrl(d.pdf) || safeUrl(d.github)) ? docBtns(d, true) : ""}
      </div>`;
  if(!d.body){
    body.innerHTML = `<div class="rinner">${meta}<div class="rmiss">
        <p>本文はこのサイトに載せていません。</p>
        ${d.tier === 3 ? "<p>🔒 鍵付きの資料です。題名と日付だけを載せています。</p>" : ""}
        ${(safeUrl(d.pdf) || safeUrl(d.github)) ? "<p>元の資料は、GitHub にログインしている端末で開けます。</p>" : "<p>元の資料へのリンクもありません。</p>"}
      </div></div>`;
  }else if(isHtml){
    body.innerHTML = "";
    const stack = document.createElement("div");
    stack.className = "rstack";
    const warn = dataWarning(d);          // データ駆動の成果物は、空に見える理由を先に出す
    if(warn) stack.appendChild(warn);
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts allow-popups");
    f.title = d.title;
    f.srcdoc = d.body;
    stack.appendChild(f);
    body.appendChild(stack);
  }else{
    body.innerHTML = `<div class="rinner">${meta}<div class="prose">${d.body}</div></div>`;
    body.querySelectorAll(".prose table").forEach(t2 => {
      if(t2.parentElement.classList.contains("tablewrap")) return;
      const w = document.createElement("div"); w.className = "tablewrap";
      t2.parentNode.insertBefore(w, t2); w.appendChild(t2);
    });
    // 本文中の外部リンクは新しいタブで開く（同じタブだと、読んでいた場所に戻れない）
    body.querySelectorAll(".prose a[href]").forEach(a => {
      if(/^https?:\/\//i.test(a.getAttribute("href"))){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
    });
  }
  body.scrollTop = 0;
}

/* ============ 画面の切り替え（ハッシュ） ============ */
const NAV = [["home","#/","ホーム"],["people","#/people","人物"],["docs","#/docs","資料"],["tools","#/tools","ツールとサイト"]];
const TITLES = {home:"きょうの机", people:"人物", docs:"資料", tools:"ツールとサイト"};
let cur = {name:"home"}, baseKey = null, histIdx = 0, replacing = false, overlay = null, lastFocus = null;
const scrollMemo = {};
let wired = false;

function parseHash(){
  const h = location.hash.replace(/^#/, "");
  if(!h || h === "/") return {name:"home"};
  const parts = h.split("/");
  const seg = parts[1] || "";
  const rest = parts.slice(2).join("/");
  switch(seg){
    case "people": return {name:"people", arg: dec(rest.replace(/\/+$/, ""))};
    case "docs":   return {name:"docs"};
    case "tools":  return {name:"tools", arg: dec(rest.replace(/\/+$/, ""))};
    case "p":      return {name:"p", arg: dec(rest.replace(/\/+$/, ""))};
    case "d":      return {name:"d", arg: dec(rest.replace(/\/+$/, ""))};
    case "q":      return {name:"q", arg: dec(rest)};
    default:       return {name:"home"};
  }
}
function buildChrome(){
  $("tabs").innerHTML = '<div class="brand-d">VTuber資産ポータル<small>ALTER PRODUCTION 社内</small></div>' +
    NAV.map(n => '<a href="' + n[1] + '" data-tab="' + n[0] + '">' + I[n[0]] + '<span>' + n[2] + '</span></a>').join("");
  $("icoSearch").innerHTML = I.search;
  $("sclr").innerHTML = I.x;
}
function setChrome(r){
  const tab = r.name === "p" ? "people" : r.name;
  qsa("#tabs a").forEach(a => { if(a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("topLeft").innerHTML = r.name === "p"
    ? '<button class="back" type="button" data-act="back" data-fb="#/people">' + I.back + '<span>もどる</span></button>'
    : '<span class="brand-m">VTuber資産ポータル</span>';
  let t = TITLES[r.name] || "";
  if(r.name === "p" && PBYID[r.arg]) t = PBYID[r.arg].name;
  document.title = (t ? t + " / " : "") + "VTuber資産ポータル";
}
function renderBase(r){
  cur = r;
  baseKey = r.name + "|" + (r.arg || "");
  const main = $("main");
  let h;
  try{
    if(r.name === "people") h = viewPeople(r.arg);
    else if(r.name === "docs") h = viewDocs();
    else if(r.name === "tools") h = viewTools(r.arg);
    else if(r.name === "p") h = viewPerson(r.arg);
    else h = viewHome();
    main.innerHTML = h;
    if(r.name === "docs") refreshDocs();
  }catch(e){
    // 1 つの画面の失敗で全体を落とさない。原因は必ず出す（黙って空にしない）。
    main.innerHTML = '<div class="none">この画面を表示できませんでした。<br><span class="path">' + esc(e && e.message ? e.message : e) + '</span><br><a class="btn" href="#/">ホームへ</a></div>';
  }
  setChrome(r);
}
/** 画面を描き直す（ピン留め・絞り込みの切替用）。読んでいた位置とフォーカスを保つ。 */
function refresh(sel){
  const y = window.scrollY;
  renderBase(cur);
  window.scrollTo(0, y);
  if(sel){ const el = qs(sel, $("main")); if(el) el.focus({preventScroll: true}); }
}

function setOverlay(name){
  const was = overlay;
  if(!was && name) lastFocus = document.activeElement;
  overlay = name;
  $("search").hidden = name !== "search";
  $("reader").hidden = name !== "reader";
  const app = $("app");
  if(name){ app.setAttribute("inert", ""); app.setAttribute("aria-hidden", "true"); }
  else{ app.removeAttribute("inert"); app.removeAttribute("aria-hidden"); }
  document.documentElement.classList.toggle("lock", !!name);
  if(was && !name && lastFocus && document.contains(lastFocus) && typeof lastFocus.focus === "function"){
    try{ lastFocus.focus({preventScroll: true}); }catch(e){}
  }
  return was !== name;
}
function route(traversal){
  const r = parseHash();
  if(r.name === "q" || r.name === "d"){
    if(baseKey === null){ renderBase({name:"home"}); }   // 直接リンクで来たとき、後ろに何も無いと困る
    if(r.name === "q"){
      const fresh = setOverlay("search");
      document.title = (r.arg ? "「" + r.arg + "」の結果" : "さがす") + " / VTuber資産ポータル";
      const sIn = $("sq");
      if(r.arg){ searchMode = "results"; if(sIn.value !== r.arg) sIn.value = r.arg; }
      else searchMode = "suggest";
      $("sclr").hidden = !sIn.value;
      if(fresh) resLimit = 30;
      renderSearch();
      if(fresh && searchMode === "suggest") sIn.focus({preventScroll: true});
    }else{
      setOverlay("reader");
      const dd = BYID[r.arg];
      document.title = (dd ? dd.title : "資料が見つかりません") + " / VTuber資産ポータル";
      showReader(r.arg);
      $("rback").focus({preventScroll: true});
    }
    return;
  }
  if(overlay) setOverlay(null);
  const key = r.name + "|" + (r.arg || "");
  if(key === baseKey){ setChrome(cur); return; }
  renderBase(r);
  const y = traversal && scrollMemo[histIdx] != null ? scrollMemo[histIdx] : 0;
  window.scrollTo(0, y);
  if(r.name === "tools" && !traversal) afterTools(r.arg);   // 検索から来たツールのカードまで送る
  if(!traversal) $("main").focus({preventScroll: true});
}
function onHash(){
  // 戻る/進む（履歴の項目に番号が残っている）と、リンクを押した新しい項目（残っていない）を見分ける。
  const prev = histIdx;
  if(!overlay) scrollMemo[prev] = window.scrollY;      // 画面を離れる時の位置（戻ったときに復元）
  let traversal = false;
  if(replacing){ replacing = false; try{ history.replaceState({vp: histIdx}, ""); }catch(e){} }
  else if(history.state && typeof history.state.vp === "number"){ histIdx = history.state.vp; traversal = true; }
  else{ histIdx = prev + 1; try{ history.replaceState({vp: histIdx}, ""); }catch(e){} }
  try{ route(traversal); }
  catch(e){ $("main").innerHTML = '<div class="none">この画面を表示できませんでした。<br><span class="path">' + esc(e && e.message ? e.message : e) + '</span></div>'; }
}
/** 「戻る」。この画面の前が無い（直接リンクで開いた）ときは、履歴を溜めずに既定の画面へ置き換える。 */
function goBack(fb){
  if(histIdx > 0) history.back();
  else{ replacing = true; setTimeout(() => { replacing = false; }, 400); location.replace(fb || "#/"); }
}

/* ============ 操作 ============ */
function isTyping(el){ return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable); }
function onClick(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case "opensearch":
      $("sq").value = ""; $("sclr").hidden = true; searchMode = "suggest"; resLimit = 30;
      renderSearch(); setOverlay("search"); $("sq").focus();     // iOS はタップの中で focus しないとキーボードが出ない
      if(location.hash !== "#/q/") location.hash = "#/q/";
      break;
    case "back": goBack(el.dataset.fb || "#/"); break;
    case "sclear":
      $("sq").value = ""; $("sclr").hidden = true; searchMode = "suggest";
      if(location.hash !== "#/q/") history.replaceState(history.state, "", "#/q/");
      renderSearch(); $("sq").focus();
      break;
    case "suggest":
      $("sq").value = el.dataset.v; $("sclr").hidden = false;
      searchMode = "suggest"; renderSearch(); $("sq").focus();
      break;
    case "resmore": resLimit += 30; renderSearch(); break;
    case "pin": togglePin(el.dataset.id); refresh('[data-act="pin"][data-id="' + el.dataset.id.replace(/["\\]/g, "\\$&") + '"]'); break;
    case "seen": markAllSeen(); break;
    case "docnew": goDocs({newOnly: true}); break;
    case "docrecent": goDocs({recent: true}); break;
    case "proj": goDocs({proj: el.dataset.id}); break;
    case "pstat": tstat = el.dataset.v; refresh('[data-act="pstat"][data-v="' + CSS.escape(el.dataset.v) + '"]'); break;
    case "docpdf": dst.pdf = !dst.pdf; dst.limit = 100; refreshDocs(); break;
    case "doclock": dst.lock = !dst.lock; dst.limit = 100; refreshDocs(); break;
    case "docread": dst.readable = !dst.readable; dst.limit = 100; refreshDocs(); break;
    case "docrecentchip": dst.recent = !dst.recent; dst.limit = 100; refreshDocs(); break;
    case "doccat": dst.cat = el.dataset.v || ""; dst.limit = 100; refreshDocs(); break;
    case "docprojoff": dst.proj = ""; dst.limit = 100; refreshDocs(); break;
    case "docmore": dst.limit += 100; refreshDocs(); break;
    case "docreset":
      Object.assign(dst, {q:"", pdf:false, lock:false, readable:false, recent:false, newOnly:false, cat:"", proj:"", limit:100});
      if($("dq")){ $("dq").value = ""; $("dqclr").hidden = true; }

      break;
    case "tryfull":
      dst.full = true; if($("dfull")) $("dfull").checked = true; refreshDocs();
      break;
    case "dqclear":
      dst.q = ""; dst.limit = 100; $("dq").value = ""; $("dqclr").hidden = true; refreshDocs(); $("dq").focus();
      break;
  }
}
let dqTimer = null;
function onInput(e){
  const t = e.target;
  if(t.id === "dq"){
    dst.q = t.value.trim(); dst.limit = 100;
    $("dqclr").hidden = !t.value;
    clearTimeout(dqTimer);
    dqTimer = setTimeout(refreshDocs, 120);        // 打鍵ごとに数百枚を組み直さない
  }else if(t.id === "sq"){
    $("sclr").hidden = !t.value;
    if(searchMode === "results"){
      // 打ち直したら「結果のページ」ではなく候補に戻す（アドレスの語と画面がずれないように）
      searchMode = "suggest";
      if(location.hash !== "#/q/") history.replaceState(history.state, "", "#/q/");
    }
    resLimit = 30;
    renderSearch();
  }
}
function onChange(e){
  if(e.target.id === "dfull"){ dst.full = e.target.checked; dst.limit = 100; refreshDocs(); }
}
function onSearchKey(e){
  if(e.isComposing || e.keyCode === 229) return;       // 日本語入力の変換確定の Enter を取らない
  const opts = qsa("[data-opt]", $("sres"));
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    if(!opts.length) return;
    e.preventDefault();
    sActive = e.key === "ArrowDown" ? Math.min(opts.length - 1, sActive + 1) : Math.max(-1, sActive - 1);
    opts.forEach((o, i) => o.classList.toggle("act", i === sActive));
    if(sActive >= 0) opts[sActive].scrollIntoView({block: "nearest"});
  }else if(e.key === "Enter"){
    e.preventDefault();
    if(sActive >= 0 && opts[sActive]){ opts[sActive].click(); return; }
    const q = $("sq").value.trim();
    if(q){ $("sq").blur(); location.hash = "#/q/" + enc(q); }
  }
}
function onKey(e){
  if(e.key === "Escape" && overlay){ goBack(overlay === "reader" ? "#/docs" : "#/"); return; }
  if(e.key === "/" && !overlay && !isTyping(e.target) && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault(); $("openSearch").click();
  }
}

function wireOnce(){
  if(wired) return;
  wired = true;
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", onKey);
  $("sq").addEventListener("keydown", onSearchKey);
  window.addEventListener("hashchange", onHash);
  $("rtitle").onclick = () => $("rtitle").classList.toggle("open");
  // 本文の中の「#見出し」リンクは、サイトの画面切り替えと取り違えない（押すと読み手が閉じてホームに戻ってしまう）
  $("rbody").addEventListener("click", e => {
    const a = e.target.closest(".prose a[href]"); if(!a) return;
    const h = a.getAttribute("href");
    if(h && h.charAt(0) === "#"){
      e.preventDefault();
      const id = dec(h.slice(1)).replace(/["\\]/g, "\\$&");
      const t = id ? qs('[id="' + id + '"]', $("rbody")) : null;
      if(t) t.scrollIntoView();
    }
  });
  if("scrollRestoration" in history) history.scrollRestoration = "manual";
}

function render(){
  prepare();
  $("loading").hidden = true;
  $("app").hidden = false;
  buildChrome();
  computeNew();
  wireOnce();
  if(history.state && typeof history.state.vp === "number") histIdx = history.state.vp;
  else{ histIdx = 0; try{ history.replaceState({vp: 0}, ""); }catch(e){} }
  route(false);
}

boot().catch(fatal);
</script>
